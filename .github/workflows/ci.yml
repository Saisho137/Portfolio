# Same gates as `npm run prepush` (in check mode, nothing is auto-fixed) plus the E2E suite.
# Covers what the local pre-push hook can't: Dependabot PRs and pushes made without it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Git hooks are for local commits only
  HUSKY: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions pinned by commit SHA (tags can be moved); Dependabot keeps them updated
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # volta.node
          cache: npm

      - name: Use the npm version pinned in package.json#volta
        run: npm install --global "npm@$(node -p "require('./package.json').volta.npm")"

      - run: npm ci

      # Blocking for what ships to the browser; the full report (dev tooling included)
      # is informative, since some dev-only advisories have no fixed version yet
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test
      - run: npm run build

      # Uses the runner's Google Chrome (channel: 'chrome'): no browser download
      - run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
