name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its previous run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Format · Lint · Typecheck · Knip · Test · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node from package.json#volta; npm cache is automatic (devEngines.packageManager is npm)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # devEngines rejects an npm outside 11.10–11.x: use the exact one pinned for Volta
      - run: npm install -g "npm@$(node -p "require('./package.json').volta.npm")"
      - run: npm ci

      # Check-only variants of what prepush auto-fixes
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test
      - run: npm run build

      # visual: baselines are -darwin only; lighthouse: targets production
      # Chrome comes preinstalled on ubuntu-latest (channel: 'chrome')
      - run: npx playwright test --project=desktop --project=mobile

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
